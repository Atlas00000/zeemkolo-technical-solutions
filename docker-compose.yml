services:
  postgres:
    image: postgres:16-alpine
    container_name: zeemkolo_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_duration_statement=500"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zeemkolo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeemkolo_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-zeemkolo_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeemkolo_admin} -d ${POSTGRES_DB:-zeemkolo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: zeemkolo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional full-stack containers (use hybrid local: db:up + pnpm dev)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zeemkolo_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zeemkolo_admin}:${POSTGRES_PASSWORD:-zeemkolo_secret_password}@postgres:5432/${POSTGRES_DB:-zeemkolo_db}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 5000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: zeemkolo_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-warn}
    depends_on:
      - server
    profiles:
      - full
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
